databases:
  # ─────────────────────────────────────────────────────
  #  Render Managed PostgreSQL Database (Free Tier)
  # ─────────────────────────────────────────────────────
  - name: land-record-db
    databaseName: land_record_db
    user: postgres
    plan: free

services:
  # ─────────────────────────────────────────────────────
  #  Express Backend — Render Web Service (Node.js)
  # ─────────────────────────────────────────────────────
  - type: web
    name: ilrd-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000          # Render assigns 10000 internally; Express reads this
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: land-record-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true   # Render automatically generates a secure random 32-char secret
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false           # Set to https://your-frontend-site.onrender.com after frontend deploys
      - key: GEMINI_API_KEY
        sync: false           # Google Gemini Multimodal Vision API Key

  # ─────────────────────────────────────────────────────
  #  Next.js Frontend — Render Static Site
  # ─────────────────────────────────────────────────────
  - type: static
    name: ilrd-frontend
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: out
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false           # Set to https://your-backend.onrender.com/api after backend deploys
