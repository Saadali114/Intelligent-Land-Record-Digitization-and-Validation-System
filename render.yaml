services:
  # ─────────────────────────────────────────────────────
  #  Express Backend — Render Web Service (Node.js)
  # ─────────────────────────────────────────────────────
  - type: web
    name: ilrd-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000          # Render assigns 10000 internally; Express reads this
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false           # Set this in Render Dashboard → Environment
      - key: JWT_SECRET
        sync: false           # Set this in Render Dashboard → Environment
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false           # Set to https://your-frontend-site.onrender.com after frontend deploys

  # ─────────────────────────────────────────────────────
  #  Next.js Frontend — Render Static Site
  # ─────────────────────────────────────────────────────
  - type: static
    name: ilrd-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: out
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false           # Set to https://your-backend.onrender.com/api after backend deploys
