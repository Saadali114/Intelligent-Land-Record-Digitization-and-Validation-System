databases:
  # ─────────────────────────────────────────────────────
  #  Render Managed PostgreSQL Database (Free Tier)
  # ─────────────────────────────────────────────────────
  - name: land-record-db
    databaseName: land_record_db
    user: postgres
    plan: free

services:
  # ─────────────────────────────────────────────────────
  #  Express Backend — Render Web Service (Node.js)
  # ─────────────────────────────────────────────────────
  - type: web
    name: ilrd-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000          # Render assigns 10000 internally; Express reads this
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: land-record-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true   # Render automatically generates a secure random 32-char secret
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false           # Set to https://your-frontend-site.onrender.com after frontend deploys
      - key: GEMINI_API_KEY
        sync: false           # Google Gemini Multimodal Vision API Key
      - key: EMAIL_PROVIDER
        value: emailjs
      - key: EMAILJS_SERVICE_ID
        value: service_u2dyh2v
      - key: EMAILJS_TEMPLATE_ID
        value: template_bntua1h
      - key: EMAILJS_PUBLIC_KEY
        value: GBd2TCv59gGvB302P
      - key: EMAILJS_PRIVATE_KEY
        value: DjFMOLRG2WfYmUmT1-PRx

  # ─────────────────────────────────────────────────────
  #  Next.js Frontend — Render Static Site
  # ─────────────────────────────────────────────────────
  - type: static
    name: ilrd-frontend
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: out
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://api.emailjs.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: http://localhost:* ws://localhost:*; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(self), microphone=(), geolocation=(), browsing-topics=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains; preload"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://ilrd-backend.onrender.com/api
      - key: NEXT_PUBLIC_EMAILJS_SERVICE_ID
        value: service_u2dyh2v
      - key: NEXT_PUBLIC_EMAILJS_TEMPLATE_ID
        value: template_bntua1h
      - key: NEXT_PUBLIC_EMAILJS_PUBLIC_KEY
        value: GBd2TCv59gGvB302P
